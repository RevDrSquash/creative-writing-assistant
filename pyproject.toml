[tool.poetry]
name = "writing-agent-v2"
version = "0.1.0"
description = "Local-first AI writing workspace for long-form fiction and worldbuilding"
authors = []
readme = "docs/overview.md"
packages = [{ include = "app" }]

[tool.poetry.scripts]
writing-agent = "app.ui.app:main"

[tool.poetry.dependencies]
python = "^3.10"
nicegui = "*"
pydantic = "^2.0"
pydantic-settings = "^2.0"
python-dotenv = "*"
langchain = "^1.0"
langchain-core = "^1.0"
langgraph = "^1.0"
langsmith = "^0.3.0"
langchain-openai = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
ruff = "*"
pytest-asyncio = "^1.4.0"
pre-commit = "^4.6.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = [
    "I",    # import sorting
    "B",    # likely bugs / unsafe patterns
    "UP",   # modern Python syntax
    "RUF",  # Ruff-specific correctness rules
    "PT",   # pytest style
    "T20",  # disallow stray print()
]
