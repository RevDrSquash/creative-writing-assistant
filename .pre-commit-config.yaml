# Fast lint/format gate on every commit. Uses the project's own Ruff via Poetry
# (language: system) so the hook can never drift from the version pinned in
# pyproject.toml / poetry.lock.
#
# One-time setup after `poetry install`:
#   poetry run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format
        language: system
        types: [python]
        require_serial: true
